version: "3.9"

services:
  app:
    build: ./app
    container_name: backend
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
    ports:
      - "${PORT}:3000"
    networks:
      - backend-network
    read_only: true
    security_opt:
      - no-new-privileges:true


# PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres  
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - backend-network
  
volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge
