version: "3.9"

services:
  app:
    image: backend:latest
    container_name: backend
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: backend_db
      DB_PORT: 5432
      JWT_SECRET: supersecretkey
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - backend-network
    read_only: true
    security_opt:
      - no-new-privileges:true


# PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres  
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - backend-network
  
volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge
